<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Gabriel Madureira - Desenvolvedor Full Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- decoração de código -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#ffffff" opacity="0.10">
    <text x="40" y="50">const dev = {</text>
    <text x="64" y="80">nome: "Gabriel",</text>
    <text x="64" y="110">stack: ["JS", "TS", "Python"],</text>
    <text x="40" y="140">};</text>
    <text x="820" y="200">&lt;/&gt;  { }  =&gt;  []  ()</text>
  </g>

  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Gabriel Madureira</text>
  <rect x="470" y="135" width="260" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="180" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" fill="#cfe9f5">Desenvolvedor Full Stack  •  IA &amp; Automações</text>
  <text x="600" y="215" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#36bcf7">JavaScript | TypeScript | Python | Ruby | SQL | React</text>
</svg>
